<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('flash_tema_cores');
        if (!raw) return;
        var cores = JSON.parse(raw);
        var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var v = escuro ? cores.dark : cores.light;
        if (!v) return;
        var s = document.documentElement.style;
        s.setProperty('--accent', v.accent);
        s.setProperty('--accent-grad-1', v.grad1);
        s.setProperty('--accent-grad-2', v.grad2);
        s.setProperty('--accent-soft', v.soft);
        if (v.contrast) s.setProperty('--accent-contrast', v.contrast);
      } catch (e) {}
    })();
  </script>
  <style>
    /* ── Fundo ambiente ──────────────────────────────────────────────
       O logo-full.png já traz sua própria mancha de tinta verde-azulada
       (não recortamos/recriamos a arte) — em vez de prendê-lo numa caixa
       degradê própria (duplicando o efeito), deixamos ele "flutuar" livre
       sobre um brilho radial suave que ecoa a mesma cor, pra mancha do
       logo se misturar com o fundo da página em vez de parecer um retângulo
       colado por cima. */
    html, body { min-height: 100%; }
    body {
      display: flex;
      justify-content: center;
      background:
        radial-gradient(60% 42% at 50% 8%, color-mix(in srgb, var(--accent-grad-2) 22%, transparent), transparent 70%),
        var(--bg);
      overflow-x: hidden;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(60% 42% at 50% 8%, color-mix(in srgb, var(--accent-grad-2) 30%, transparent), transparent 70%),
          var(--bg);
      }
    }
    .glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .glow span {
      position: absolute;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.16;
      animation: deriva 26s ease-in-out infinite;
    }
    .glow span:nth-child(1) { top: -22vmax; left: -18vmax; background: var(--accent-grad-1); }
    .glow span:nth-child(2) { bottom: -26vmax; right: -20vmax; background: var(--accent-grad-2); animation-delay: -13s; animation-direction: reverse; }
    @keyframes deriva {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 3%) scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .glow span { animation: none; }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(28px + env(safe-area-inset-top, 0px)) 24px calc(28px + env(safe-area-inset-bottom, 0px));
      gap: 28px;
    }

    .marca {
      display: flex;
      justify-content: center;
      opacity: 0;
      animation: subir 0.5s ease-out 0.05s forwards;
    }
    .marca img {
      width: 100%;
      max-width: 360px;
      height: auto;
    }

    /* ── Cartão de acesso ─────────────────────────────────────────────
       O "recibo" é a metáfora central do app (lançar = emitir um recibo
       digital em segundos) — a serrilha no topo do card é o único
       elemento de assinatura desta tela: referencia o rasgo de um recibo
       de papel, sem forçar a estética em mais nada ao redor. */
    .cartao {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 48px -20px rgba(6, 34, 33, 0.28);
      padding: 28px 24px 24px;
      opacity: 0;
      animation: subir 0.5s ease-out 0.16s forwards;
    }
    @media (prefers-color-scheme: dark) {
      .cartao { box-shadow: 0 24px 48px -20px rgba(0, 0, 0, 0.55); }
    }
    @keyframes subir {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .marca, .cartao { animation: none; opacity: 1; }
    }

    .serrilha {
      height: 14px;
      margin: -28px -24px 20px;
      background-image: radial-gradient(circle at 7px 7px, var(--bg) 5.5px, transparent 6px);
      background-size: 16px 14px;
      background-repeat: repeat-x;
      background-position: center;
    }
    @media (prefers-color-scheme: dark) {
      .serrilha { background-image: radial-gradient(circle at 7px 7px, var(--bg) 5.5px, transparent 6px); }
    }

    form { display: flex; flex-direction: column; gap: 16px; }

    .campo-icone { position: relative; }
    .campo-icone svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .campo-icone input { padding-left: 44px; }

    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"><span></span><span></span></div>

  <div class="shell">
    <div class="marca">
      <img src="/img/logo-full.png" alt="FinZen Flash — lance um gasto em segundos">
    </div>

    <div class="cartao">
      <div class="serrilha" aria-hidden="true"></div>

      <form id="form-login">
        <div class="field campo-icone">
          <label for="email">E-MAIL</label>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg>
          <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" required>
        </div>
        <div class="field campo-icone">
          <label for="senha">SENHA</label>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button id="btn-entrar" type="submit" class="btn-primary" style="margin-top:8px;">Entrar</button>
        <div id="erro-login" class="error-msg"></div>
      </form>
    </div>

    <div class="hint">mesma conta do FinZen — dados compartilhados</div>
  </div>

  <script type="module" src="/js/login.js?v=4"></script>
</body>
</html>
