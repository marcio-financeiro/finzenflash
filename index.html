<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinZen Flash</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .hero {
      background: linear-gradient(135deg, var(--accent-grad-1), var(--accent-grad-2));
      padding: 64px 28px 44px 28px;
      border-radius: 0 0 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hero-icon {
      width: 44px;
      height: 60px;
      display: flex;
      align-items: flex-end;
    }
    .hero-title {
      font-size: 24px;
      margin-top: 10px;
    }
    .hero-title-strong {
      font-weight: 800;
      color: #ffffff;
    }
    .hero-title-light {
      font-weight: 700;
      color: #bfe9e2;
    }
    .hero-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }
    form {
      flex: 1;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div class="hero-icon">
        <svg width="44" height="60" viewBox="0 0 220 300">
          <text x="163" y="52" font-family="Manrope, sans-serif" font-weight="800" font-size="42" fill="#eaf5f4" text-anchor="middle">$</text>
          <rect x="20" y="76" width="160" height="34" fill="#eaf5f4"/>
          <rect x="20" y="234" width="160" height="34" fill="#eaf5f4"/>
          <path d="M165,110 C90,140 170,165 42,234" fill="none" stroke="#eaf5f4" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M165,110 C90,140 170,165 42,234" fill="none" stroke="#7fd0c4" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
        </svg>
      </div>
      <div class="hero-title"><span class="hero-title-strong">FinZen</span> <span class="hero-title-light">Flash</span></div>
      <div class="hero-subtitle">lance um gasto em segundos</div>
    </div>

    <form id="form-login">
      <div class="field">
        <label for="email">E-MAIL</label>
        <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="senha">SENHA</label>
        <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button id="btn-entrar" type="submit" class="btn-primary" style="margin-top:8px;">Entrar</button>
      <div id="erro-login" class="error-msg"></div>
      <div class="hint">mesma conta do FinZen — dados compartilhados</div>
    </form>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
