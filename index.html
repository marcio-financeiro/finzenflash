<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .hero {
      background: linear-gradient(135deg, var(--accent-grad-1), var(--accent-grad-2));
      padding: calc(48px + env(safe-area-inset-top, 0px)) 28px 48px 28px;
      border-radius: 0 0 28px 28px;
      display: flex;
      justify-content: center;
    }
    .hero-logo {
      width: 100%;
      max-width: 340px;
      height: auto;
    }
    form {
      flex: 1;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <img class="hero-logo" src="/img/logo-full.png" alt="FinZen Flash — lance um gasto em segundos">
    </div>

    <form id="form-login">
      <div class="field">
        <label for="email">E-MAIL</label>
        <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="senha">SENHA</label>
        <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button id="btn-entrar" type="submit" class="btn-primary" style="margin-top:8px;">Entrar</button>
      <div id="erro-login" class="error-msg"></div>
      <div class="hint">mesma conta do FinZen — dados compartilhados</div>
    </form>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
