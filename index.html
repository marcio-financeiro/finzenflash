<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinZen Flash</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .hero {
      background: linear-gradient(135deg, var(--accent-grad-1), var(--accent-grad-2));
      padding: 64px 28px 44px 28px;
      border-radius: 0 0 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hero-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-title {
      font-size: 24px;
      font-weight: 800;
      margin-top: 10px;
      color: #ffffff;
    }
    .hero-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }
    form {
      flex: 1;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div class="hero-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div class="hero-title">FinZen Flash</div>
      <div class="hero-subtitle">lance um gasto em segundos</div>
    </div>

    <form id="form-login">
      <div class="field">
        <label for="email">E-MAIL</label>
        <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="senha">SENHA</label>
        <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button id="btn-entrar" type="submit" class="btn-primary" style="margin-top:8px;">Entrar</button>
      <div id="erro-login" class="error-msg"></div>
      <div class="hint">mesma conta do FinZen — dados compartilhados</div>
    </form>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
