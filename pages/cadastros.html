<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cadastros — FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('flash_tema_cores');
        if (!raw) return;
        var cores = JSON.parse(raw);
        var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var v = escuro ? cores.dark : cores.light;
        if (!v) return;
        var s = document.documentElement.style;
        s.setProperty('--accent', v.accent);
        s.setProperty('--accent-grad-1', v.grad1);
        s.setProperty('--accent-grad-2', v.grad2);
        s.setProperty('--accent-soft', v.soft);
      } catch (e) {}
    })();
  </script>
  <style>
    body { display: flex; justify-content: center; align-items: flex-start; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .topo {
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .topo-titulo { font-size: 20px; font-weight: 800; }

    .secao {
      flex: 1;
      padding: 4px 20px 84px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .grupo-titulo { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 10px 0 2px 0; }
    .grupo-titulo:first-child { margin-top: 0; }

    .grupo-cadastro {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .grupo-cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
    }
    .grupo-titulo-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; padding: 0; font-family: inherit; min-width: 0; color: var(--text); }
    .grupo-nome { font-size: 15px; font-weight: 800; color: var(--text); }
    .grupo-contagem { font-size: 11px; color: var(--muted); font-weight: 700; background: var(--surface-2); padding: 2px 8px; border-radius: 10px; }
    .grupo-chevron { flex-shrink: 0; color: var(--muted); transition: transform 0.2s; }
    .grupo-cadastro.colapsado .grupo-chevron { transform: rotate(-90deg); }
    .grupo-cadastro.colapsado .grupo-cabecalho { padding-bottom: 14px; }
    .btn-add-grupo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .grupo-conteudo {
      padding: 0 16px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .grupo-cadastro.colapsado .grupo-conteudo { display: none; }

    .item-cadastro {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      width: 100%;
      text-align: left;
      font-family: inherit;
      color: var(--text);
    }
    .item-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
      color: #fff;
      font-weight: 800;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-nome { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .item-detalhe { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .item-inativo { opacity: 0.5; }
    .badge-inativo { font-size: 10px; font-weight: 800; color: var(--danger); background: var(--danger-soft); padding: 2px 7px; border-radius: 10px; }

    .conta-vazia { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }

    .nav-inferior {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-inferior-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-item.ativo { color: var(--accent); }

    .mais-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      font-family: inherit;
      text-align: left;
    }
    .mais-item:last-child { border-bottom: none; }
    .mais-item svg { flex-shrink: 0; color: var(--muted); }
    .mais-item.ativo { color: var(--accent); }
    .mais-item.ativo svg { color: var(--accent); }
    .mais-item.perigo { color: var(--danger); }
    .mais-item.perigo svg { color: var(--danger); }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(16,38,42,0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }
    .sheet-overlay[hidden] { display: none; }
    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: calc(85vh - env(safe-area-inset-top, 0px));
      overflow-y: auto;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); align-self: center; flex-shrink: 0; }
    .sheet-titulo { font-size: 16px; font-weight: 800; text-align: center; flex-shrink: 0; }
    .sheet-acao-btn {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .sheet-acao-btn.perigo { border-color: var(--danger); color: var(--danger); }

    .form-linha { display: flex; gap: 10px; }
    .form-linha .field { flex: 1; }
    .field select {
      height: 52px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0 14px;
      font-size: 15px;
      font-family: inherit;
      width: 100%;
    }
    .field input[type="color"] { height: 52px; padding: 4px; cursor: pointer; }
    .error-msg { color: var(--danger); font-size: 13px; text-align: center; min-height: 16px; }

    .orcamento-mes-seletor {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-2);
      border-radius: var(--radius-md);
      padding: 6px 4px;
      margin-bottom: 4px;
    }
    .orcamento-mes-seletor button {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: none;
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orcamento-mes-seletor span { font-size: 12px; font-weight: 800; }
    .orcamento-copiar-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topo">
      <div class="topo-titulo">Cadastros</div>
    </div>

    <div class="secao">
      <div class="grupo-cadastro" data-grupo="contas">
        <div class="grupo-cabecalho">
          <button type="button" class="grupo-titulo-btn" data-toggle-grupo="contas">
            <svg class="grupo-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            <span class="grupo-nome">Contas</span>
            <span class="grupo-contagem" id="contagem-contas">0</span>
          </button>
          <button type="button" class="btn-add-grupo" data-add-grupo="conta" aria-label="Nova conta">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="grupo-conteudo" id="lista-contas"></div>
      </div>

      <div class="grupo-cadastro" data-grupo="cartoes">
        <div class="grupo-cabecalho">
          <button type="button" class="grupo-titulo-btn" data-toggle-grupo="cartoes">
            <svg class="grupo-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            <span class="grupo-nome">Cartões</span>
            <span class="grupo-contagem" id="contagem-cartoes">0</span>
          </button>
          <button type="button" class="btn-add-grupo" data-add-grupo="cartao" aria-label="Novo cartão">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="grupo-conteudo" id="lista-cartoes"></div>
      </div>

      <div class="grupo-cadastro" data-grupo="categorias">
        <div class="grupo-cabecalho">
          <button type="button" class="grupo-titulo-btn" data-toggle-grupo="categorias">
            <svg class="grupo-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            <span class="grupo-nome">Categorias</span>
            <span class="grupo-contagem" id="contagem-categorias">0</span>
          </button>
          <button type="button" class="btn-add-grupo" data-add-grupo="categoria" aria-label="Nova categoria">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="grupo-conteudo" id="lista-categorias"></div>
      </div>

      <div class="grupo-cadastro" data-grupo="recorrentes">
        <div class="grupo-cabecalho">
          <button type="button" class="grupo-titulo-btn" data-toggle-grupo="recorrentes">
            <svg class="grupo-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            <span class="grupo-nome">Recorrentes</span>
            <span class="grupo-contagem" id="contagem-recorrentes">0</span>
          </button>
          <button type="button" class="btn-add-grupo" data-add-grupo="recorrente" aria-label="Novo lançamento recorrente">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="grupo-conteudo" id="lista-recorrentes"></div>
      </div>

      <div class="grupo-cadastro" data-grupo="orcamentos">
        <div class="grupo-cabecalho">
          <button type="button" class="grupo-titulo-btn" data-toggle-grupo="orcamentos">
            <svg class="grupo-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            <span class="grupo-nome">Orçamentos</span>
            <span class="grupo-contagem" id="contagem-orcamentos">0</span>
          </button>
          <button type="button" class="btn-add-grupo" data-add-grupo="orcamento" aria-label="Novo orçamento">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="grupo-conteudo">
          <div class="orcamento-mes-seletor">
            <button type="button" id="btn-orcamento-mes-anterior" aria-label="Mês anterior">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span id="orcamento-mes-label">—</span>
            <button type="button" id="btn-orcamento-mes-proximo" aria-label="Próximo mês">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <div id="lista-orcamentos"></div>
        </div>
      </div>
    </div>

    <div id="nav-inferior-slot"></div>
  </div>

  <div class="sheet-overlay" id="sheet-form" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="sheet-form-conteudo"></div>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-acoes" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="sheet-acoes-conteudo"></div>
    </div>
  </div>

  <script type="module" src="../js/cadastros.js?v=12"></script>
</body>
</html>
