<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cartão — FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .topo {
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .topo-linha { display: flex; align-items: center; justify-content: space-between; }
    .topo-titulo { font-size: 20px; font-weight: 800; }
    .btn-privacidade {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--surface-2);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip-conta {
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
    }
    .chip-conta.selecionada {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .seletor-fatura {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 6px;
    }
    .seletor-fatura button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: var(--surface-2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #fatura-atual { font-size: 14px; font-weight: 800; }

    .painel {
      background: linear-gradient(135deg, var(--accent-grad-1), var(--accent-grad-2));
      border-radius: var(--radius-lg);
      padding: 18px 18px 16px 18px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .painel-linha { display: flex; justify-content: space-between; align-items: flex-end; }
    .painel-rotulo { font-size: 11px; color: rgba(255,255,255,0.75); font-weight: 700; }
    .painel-valor { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .painel-venc { font-size: 12px; color: rgba(255,255,255,0.85); font-weight: 600; text-align: right; }

    .limite-barra { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.25); overflow: hidden; }
    .limite-barra-fill { height: 100%; background: #ffffff; border-radius: 4px; }
    .limite-legenda { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.85); font-weight: 600; }

    .btn-pagar-fatura {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-md);
      border: none;
      background: rgba(255,255,255,0.22);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .fatura-paga-aviso {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
    }
    .btn-pagar-fatura[hidden], .fatura-paga-aviso[hidden] { display: none; }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(16,38,42,0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }
    .sheet-overlay[hidden] { display: none; }
    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: calc(85vh - env(safe-area-inset-top, 0px));
      overflow-y: auto;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); align-self: center; flex-shrink: 0; }
    .sheet-titulo { font-size: 16px; font-weight: 800; text-align: center; flex-shrink: 0; }
    .sheet-valor-pagar { font-size: 32px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
    .sheet select {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      padding: 0 14px;
    }

    .secao {
      flex: 1;
      padding: 4px 20px 84px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .secao-titulo { font-size: 14px; font-weight: 800; margin-top: 6px; }

    .compra-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity 0.15s;
    }
    .compra-card.pressionando { opacity: 0.55; }
    .compra-info { flex: 1; min-width: 0; }
    .compra-desc { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compra-parcela { font-size: 12px; color: var(--muted); }
    .compra-valor { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .sheet-aviso { font-size: 13px; color: var(--muted); text-align: center; margin-top: -8px; }
    .sheet-acao-btn {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .sheet-acao-btn.perigo { border-color: var(--danger); color: var(--danger); }

    .conta-vazia { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }

    .fab {
      position: fixed;
      right: 50%;
      transform: translateX(190px);
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      width: 58px;
      height: 58px;
      border-radius: 20px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(14,124,134,0.4);
      text-decoration: none;
      z-index: 10;
    }
    @media (max-width: 480px) {
      .fab { right: 20px; transform: none; }
    }

    .nav-inferior {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: center;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-inferior-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-item.ativo { color: var(--accent); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topo">
      <div class="topo-linha">
        <div class="topo-titulo">Cartão</div>
        <button type="button" id="btn-privacidade" class="btn-privacidade" aria-label="Ocultar valores"></button>
      </div>

      <div class="chips" id="lista-cartoes-chip"></div>

      <div class="seletor-fatura">
        <button type="button" id="btn-fatura-anterior" aria-label="Fatura anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="fatura-atual">—</span>
        <button type="button" id="btn-fatura-proxima" aria-label="Próxima fatura">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="painel">
        <div class="painel-linha">
          <div>
            <div class="painel-rotulo">TOTAL DA FATURA</div>
            <div class="painel-valor valor-sensivel" id="total-fatura">R$ 0,00</div>
          </div>
          <div class="painel-venc" id="venc-fatura"></div>
        </div>
        <div>
          <div class="limite-barra"><div class="limite-barra-fill" id="limite-barra-fill" style="width:0%"></div></div>
          <div class="limite-legenda">
            <span id="limite-usado" class="valor-sensivel">Usado R$ 0,00</span>
            <span id="limite-disponivel" class="valor-sensivel">Disp. R$ 0,00</span>
          </div>
        </div>
        <button type="button" class="btn-pagar-fatura" id="btn-pagar-fatura" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
          Pagar fatura
        </button>
        <div class="fatura-paga-aviso" id="fatura-paga-aviso" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
          Fatura paga
        </div>
      </div>
    </div>

    <div class="secao">
      <div class="secao-titulo">Compras da fatura</div>
      <div id="lista-compras"></div>
    </div>

    <a class="fab" href="/pages/comprar-cartao.html" aria-label="Nova compra">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>

    <div class="nav-inferior">
      <div class="nav-inferior-inner">
        <a class="nav-item" href="/pages/home.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"/></svg>
          Início
        </a>
        <a class="nav-item ativo" href="/pages/cartao.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>
          Cartão
        </a>
        <a class="nav-item" href="/pages/extrato.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          Extrato
        </a>
        <a class="nav-item" href="/pages/cadastros.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
          Cadastros
        </a>
        <a class="nav-item" href="/pages/investimentos.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          Investir
        </a>
        <button type="button" class="nav-item" id="btn-sair-nav">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Sair
        </button>
      </div>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-pagar" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-titulo">Pagar fatura</div>
      <div class="sheet-valor-pagar valor-sensivel" id="sheet-valor-pagar">R$ 0,00</div>
      <div>
        <div class="campo-rotulo" style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px;">CONTA PARA DEBITAR</div>
        <select id="sheet-select-conta"><option value="">Selecione a conta</option></select>
      </div>
      <div id="erro-pagar" class="error-msg"></div>
      <button type="button" class="btn-primary" id="btn-confirmar-pagamento">Confirmar pagamento</button>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-compra" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="sheet-compra-conteudo"></div>
    </div>
  </div>

  <script type="module" src="../js/cartaoHub.js?v=4"></script>
</body>
</html>
