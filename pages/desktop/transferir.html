<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinZen Flash · Transferir</title>
  <link rel="icon" href="/img/logo-mark.png">
  <meta name="theme-color" content="#0E7C86">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/desktop/shell.css">
  <link rel="stylesheet" href="/css/desktop/components.css">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('flash_tema_cores');
        if (!raw) return;
        var cores = JSON.parse(raw);
        var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var v = escuro ? cores.dark : cores.light;
        if (!v) return;
        var s = document.documentElement.style;
        s.setProperty('--accent', v.accent);
        s.setProperty('--accent-grad-1', v.grad1);
        s.setProperty('--accent-grad-2', v.grad2);
        s.setProperty('--accent-soft', v.soft);
        if (v.contrast) s.setProperty('--accent-contrast', v.contrast);
      } catch (e) {}
    })();
  </script>
  <style>
    .transferir-form { max-width: 560px; display: flex; flex-direction: column; gap: 20px; }
    .transferir-valor {
      height: 64px; border-radius: var(--radius-lg); border: 1.5px solid var(--border); background: var(--surface);
      display: flex; align-items: center; padding: 0 20px; font-size: 30px; font-weight: 800;
      font-variant-numeric: tabular-nums; color: var(--text);
    }
    .transferir-campo label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .transferir-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .transferir-seta { color: var(--muted); }
    .historico-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border);
      text-align: left; background: none; border-left: none; border-right: none; border-top: none; width: 100%;
      font-family: inherit; color: var(--text); cursor: pointer;
    }
    .historico-item:last-child { border-bottom: none; }
    .historico-icone {
      width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .historico-info { flex: 1; min-width: 0; }
    .historico-desc { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .historico-contas { font-size: 12px; color: var(--muted); }
    .historico-valor { font-size: 14px; font-weight: 800; white-space: nowrap; }

    /* Teclado numérico do valor — ver comentário equivalente em lancar.html */
    .lancar-valor-modal { font-size: 32px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin: 4px 0 16px; }
    .teclado-desktop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tecla-desktop {
      height: 52px; border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--radius-md);
      font-size: 18px; font-weight: 700; color: var(--text); font-family: inherit; cursor: pointer;
    }
    .tecla-desktop:hover { border-color: var(--accent); color: var(--accent); }
    .tecla-desktop.tecla-apagar { color: var(--danger); font-size: 15px; }
  </style>
</head>
<body class="desktop-body">
  <div class="app-shell">
    <div id="rail-slot"></div>
    <div class="content">
      <div class="topbar">
        <div class="topbar-titulo">Transferir entre contas</div>
        <div class="topbar-acoes">
          <button type="button" class="btn-desktop" id="btn-historico">Histórico</button>
          <button type="button" class="topbar-busca" id="btn-topbar-busca">
            Buscar páginas <kbd>Ctrl K</kbd>
          </button>
        </div>
      </div>
      <div class="content-scroll">
        <div class="pagina-titulo-bloco">
          <h1>Nova transferência</h1>
          <p>Mova dinheiro de uma conta pra outra sem afetar receitas/despesas.</p>
        </div>

        <div class="transferir-form">
          <div class="transferir-valor" id="valor" data-centavos="0">R$ 0,00</div>

          <div class="transferir-campo">
            <label>De</label>
            <div class="transferir-chips" id="lista-contas-origem"></div>
          </div>

          <div class="transferir-seta">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          </div>

          <div class="transferir-campo">
            <label>Para</label>
            <div class="transferir-chips" id="lista-contas-destino"></div>
          </div>

          <div class="transferir-campo" id="secao-cambio" hidden>
            <label for="cambio-cotacao">Cotação (R$ por US$)</label>
            <input type="number" step="0.01" min="0" class="input-desktop" id="cambio-cotacao" style="max-width:200px" placeholder="Ex: 5,20">
          </div>

          <div class="transferir-campo">
            <label for="data">Data</label>
            <input type="date" class="input-desktop" id="data" style="max-width:200px">
          </div>

          <div class="transferir-campo">
            <label for="descricao">Descrição (opcional)</label>
            <input type="text" class="input-desktop" id="descricao" placeholder="Ex.: reserva de emergência" style="max-width:360px">
          </div>

          <div class="error-msg" id="erro-transferir"></div>
          <button type="button" class="btn-desktop primario" id="btn-salvar" style="align-self:flex-start;padding:0 28px">Transferir</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-valor" hidden>
    <div class="modal-caixa" style="max-width:360px">
      <button type="button" class="modal-fechar" id="btn-fechar-modal-valor" aria-label="Fechar">✕</button>
      <div class="modal-titulo">Valor</div>
      <div class="lancar-valor-modal" id="valor-modal-display">R$ 0,00</div>
      <div class="teclado-desktop">
        <button type="button" class="tecla-desktop" data-acao="1">1</button>
        <button type="button" class="tecla-desktop" data-acao="2">2</button>
        <button type="button" class="tecla-desktop" data-acao="3">3</button>
        <button type="button" class="tecla-desktop" data-acao="4">4</button>
        <button type="button" class="tecla-desktop" data-acao="5">5</button>
        <button type="button" class="tecla-desktop" data-acao="6">6</button>
        <button type="button" class="tecla-desktop" data-acao="7">7</button>
        <button type="button" class="tecla-desktop" data-acao="8">8</button>
        <button type="button" class="tecla-desktop" data-acao="9">9</button>
        <button type="button" class="tecla-desktop" data-acao="00">00</button>
        <button type="button" class="tecla-desktop" data-acao="0">0</button>
        <button type="button" class="tecla-desktop tecla-apagar" data-acao="apagar">⌫</button>
      </div>
      <button type="button" class="btn-desktop primario" id="btn-concluir-valor" style="margin-top:16px;width:100%">Concluído</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal-historico" hidden>
    <div class="modal-caixa">
      <button type="button" class="modal-fechar" id="btn-fechar-modal-historico" aria-label="Fechar">✕</button>
      <div class="modal-titulo">Histórico de transferências</div>
      <div id="lista-historico" style="margin-top:12px;max-height:60vh;overflow-y:auto"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-acao-historico" hidden>
    <div class="modal-caixa">
      <button type="button" class="modal-fechar" id="btn-fechar-modal-acao-historico" aria-label="Fechar">✕</button>
      <div id="modal-acao-historico-conteudo"></div>
    </div>
  </div>

  <script type="module" src="/js/desktop/transferir.js"></script>
</body>
</html>
