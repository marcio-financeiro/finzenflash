<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinZen Flash · Projeção</title>
  <link rel="icon" href="/img/logo-mark.png">
  <meta name="theme-color" content="#0E7C86">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/desktop/shell.css">
  <link rel="stylesheet" href="/css/desktop/components.css">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('flash_tema_cores');
        if (!raw) return;
        var cores = JSON.parse(raw);
        var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var v = escuro ? cores.dark : cores.light;
        if (!v) return;
        var s = document.documentElement.style;
        s.setProperty('--accent', v.accent);
        s.setProperty('--accent-grad-1', v.grad1);
        s.setProperty('--accent-grad-2', v.grad2);
        s.setProperty('--accent-soft', v.soft);
      } catch (e) {}
    })();
  </script>
  <style>
    .tabs-horizonte { display: flex; gap: 6px; margin-bottom: 20px; }
    .tab-horizonte { padding: 8px 16px; border: 1.5px solid var(--border); background: var(--surface); color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; border-radius: 20px; }
    .tab-horizonte.ativo { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

    #painel-projecao {
      background: linear-gradient(135deg, var(--accent-grad-1), var(--accent-grad-2));
      border-radius: var(--radius-lg);
      padding: 24px;
      color: #fff;
      margin-bottom: 20px;
    }
    #painel-projecao.critico { background: linear-gradient(135deg, #b03a2e, #7b241c); }
    #projecao-titulo { font-size: 20px; font-weight: 800; }
    #projecao-sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }
    .painel-mini { display: flex; gap: 32px; margin-top: 18px; }
    .painel-mini .rotulo { font-size: 11px; text-transform: uppercase; opacity: 0.75; font-weight: 700; }
    .painel-mini .valor { font-size: 18px; font-weight: 800; margin-top: 2px; }

    .evento-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .evento-item:last-child { border-bottom: none; }
    .evento-ponto { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .evento-info { flex: 1; }
    .evento-data { font-size: 12px; color: var(--muted); }
    .evento-direita { text-align: right; }
    .evento-saldo { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body class="desktop-body">
  <div class="app-shell">
    <div id="rail-slot"></div>
    <div class="content">
      <div class="topbar">
        <div class="topbar-titulo">Saldo projetado</div>
        <div class="topbar-acoes">
          <button type="button" class="topbar-busca" id="btn-topbar-busca">Buscar <kbd>Ctrl K</kbd></button>
        </div>
      </div>
      <div class="content-scroll">
        <div class="pagina-titulo-bloco">
          <h1>Saldo projetado</h1>
          <p>O que acontece com o saldo até o fim do horizonte escolhido.</p>
        </div>

        <div class="tabs-horizonte">
          <button type="button" class="tab-horizonte" data-dias="15">15 dias</button>
          <button type="button" class="tab-horizonte ativo" data-dias="30">30 dias</button>
          <button type="button" class="tab-horizonte" data-dias="60">60 dias</button>
          <button type="button" class="tab-horizonte" data-dias="90">90 dias</button>
        </div>

        <div id="painel-projecao">
          <div id="projecao-titulo">Calculando…</div>
          <div id="projecao-sub"></div>
          <div style="height:120px;margin-top:16px"><canvas id="chart-projecao"></canvas></div>
          <div class="painel-mini">
            <div><div class="rotulo">Menor folga</div><div class="valor valor-sensivel" id="menor-folga-valor">R$ 0,00</div><div class="rotulo" id="menor-folga-data"></div></div>
            <div><div class="rotulo">Saldo no fim</div><div class="valor valor-sensivel" id="saldo-final-valor">R$ 0,00</div><div class="rotulo" id="saldo-final-data"></div></div>
          </div>
        </div>

        <div class="widget" style="--widget-cols:12">
          <div class="widget-cabecalho"><span class="widget-titulo" id="eventos-titulo">O que acontece</span></div>
          <div id="lista-eventos"><div class="lista-vazia">Carregando…</div></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/desktop/projecao.js"></script>
</body>
</html>
