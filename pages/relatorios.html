<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relatórios — FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('flash_tema_cores');
        if (!raw) return;
        var cores = JSON.parse(raw);
        var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var v = escuro ? cores.dark : cores.light;
        if (!v) return;
        var s = document.documentElement.style;
        s.setProperty('--accent', v.accent);
        s.setProperty('--accent-grad-1', v.grad1);
        s.setProperty('--accent-grad-2', v.grad2);
        s.setProperty('--accent-soft', v.soft);
      } catch (e) {}
    })();
  </script>
  <style>
    body { display: flex; justify-content: center; align-items: flex-start; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    }
    .topo {
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .topo-linha { display: flex; align-items: center; justify-content: space-between; }
    .topo-titulo { font-size: 20px; font-weight: 800; }
    .topo-acoes { display: flex; gap: 8px; }
    .btn-privacidade, .btn-exportar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--surface-2);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modo-tabs { display: flex; gap: 8px; }
    .modo-tab {
      flex: 1;
      height: 36px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
    }
    .modo-tab.ativo { background: var(--accent); border-color: var(--accent); color: #fff; }

    .seletor-mes {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 6px;
    }
    .seletor-mes[hidden] { display: none; }
    .seletor-mes button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: var(--surface-2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mes-atual { font-size: 14px; font-weight: 800; }

    .seletor-periodo { display: flex; gap: 8px; align-items: center; }
    .seletor-periodo[hidden] { display: none; }
    .seletor-periodo .field { flex: 1; }
    .seletor-periodo label { font-size: 11px; color: var(--muted); font-weight: 700; display: block; margin-bottom: 4px; }
    .seletor-periodo input {
      width: 100%;
      height: 40px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0 10px;
      font-size: 13px;
      font-family: inherit;
    }

    .conteudo { padding: 4px 20px 20px 20px; display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .card-titulo { font-size: 14px; font-weight: 800; margin-bottom: 12px; }
    .grafico-wrap { position: relative; height: 200px; }
    .grafico-wrap.categorias { height: 220px; }

    .ranking-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .ranking-item:last-child { border-bottom: none; }
    .ranking-ponto { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .ranking-nome { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ranking-valor { font-size: 13px; font-weight: 800; white-space: nowrap; }
    .ranking-pct { font-size: 11px; color: var(--muted); width: 42px; text-align: right; flex-shrink: 0; }

    .conta-vazia { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0; }

    .balanco-card { display: flex; flex-direction: column; gap: 10px; }
    .balanco-linha { display: flex; justify-content: space-between; align-items: baseline; }
    .balanco-rotulo { font-size: 13px; color: var(--muted); font-weight: 700; }
    .balanco-valor { font-size: 15px; font-weight: 800; }
    .balanco-valor.receitas { color: var(--success); }
    .balanco-valor.despesas { color: var(--danger); }
    .balanco-divisor { height: 1px; background: var(--border); margin: 2px 0; }
    .balanco-total .balanco-rotulo { color: var(--text); font-weight: 800; font-size: 14px; }
    .balanco-total .balanco-valor { font-size: 18px; }
    .balanco-badge {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .balanco-badge.subiu { background: var(--danger-soft); color: var(--danger); }
    .balanco-badge.desceu { background: var(--success-soft); color: var(--success); }

    .nav-inferior {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-inferior-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-item.ativo { color: var(--accent); }

    .mais-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      font-family: inherit;
      text-align: left;
    }
    .mais-item:last-child { border-bottom: none; }
    .mais-item svg { flex-shrink: 0; color: var(--muted); }
    .mais-item.ativo { color: var(--accent); }
    .mais-item.ativo svg { color: var(--accent); }
    .mais-item.perigo { color: var(--danger); }
    .mais-item.perigo svg { color: var(--danger); }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(16,38,42,0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }
    .sheet-overlay[hidden] { display: none; }
    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: calc(85vh - env(safe-area-inset-top, 0px));
      overflow-y: auto;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); align-self: center; flex-shrink: 0; }
    .sheet-titulo { font-size: 16px; font-weight: 800; text-align: center; flex-shrink: 0; }

    @media print {
      .topo-acoes #btn-privacidade, .modo-tabs, #nav-inferior-slot, .btn-exportar { display: none !important; }
      body, .shell { background: #fff !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topo">
      <div class="topo-linha">
        <div class="topo-titulo">Relatórios</div>
        <div class="topo-acoes">
          <button type="button" id="btn-exportar" class="btn-exportar" aria-label="Exportar PDF">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
          </button>
          <button type="button" id="btn-privacidade" class="btn-privacidade" aria-label="Ocultar valores"></button>
        </div>
      </div>

      <div class="modo-tabs">
        <button type="button" class="modo-tab ativo" id="tab-mes">Mês</button>
        <button type="button" class="modo-tab" id="tab-periodo">Período</button>
      </div>

      <div class="seletor-mes" id="seletor-mes">
        <button type="button" id="btn-mes-anterior" aria-label="Mês anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="mes-atual">—</span>
        <button type="button" id="btn-mes-proximo" aria-label="Próximo mês">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="seletor-periodo" id="seletor-periodo" hidden>
        <div class="field">
          <label for="periodo-inicio">De</label>
          <input type="date" id="periodo-inicio">
        </div>
        <div class="field">
          <label for="periodo-fim">Até</label>
          <input type="date" id="periodo-fim">
        </div>
      </div>
    </div>

    <div class="conteudo">
      <div class="card balanco-card" id="card-balanco" hidden>
        <div class="balanco-linha">
          <div class="balanco-rotulo">Receitas</div>
          <div class="balanco-valor receitas" id="balanco-receitas">R$ 0,00</div>
        </div>
        <div class="balanco-linha">
          <div class="balanco-rotulo">Despesas</div>
          <div class="balanco-valor despesas" id="balanco-despesas">R$ 0,00</div>
        </div>
        <div class="balanco-divisor"></div>
        <div class="balanco-linha balanco-total">
          <div class="balanco-rotulo">Balanço</div>
          <div class="balanco-valor" id="balanco-total">R$ 0,00</div>
        </div>
        <div class="balanco-badge" id="balanco-badge" hidden></div>
      </div>

      <div class="card" id="card-recdes">
        <div class="card-titulo" id="titulo-recdes">Receita vs Despesa — últimos 12 meses</div>
        <div class="grafico-wrap"><canvas id="chart-recdes"></canvas></div>
      </div>

      <div class="card">
        <div class="card-titulo">Despesas por Categoria</div>
        <div class="grafico-wrap categorias"><canvas id="chart-categorias"></canvas></div>
        <div id="ranking-categorias"></div>
      </div>

      <div class="card" id="card-orcamento">
        <div class="card-titulo">Orçamento vs Realizado</div>
        <div id="wrap-orcamento"><div class="conta-vazia">Carregando...</div></div>
      </div>
    </div>

    <div id="nav-inferior-slot"></div>
  </div>

  <script type="module" src="../js/relatorios.js?v=7"></script>
</body>
</html>
