<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .header {
      background: linear-gradient(135deg, var(--accent-grad-1), var(--accent-grad-2));
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 22px 20px;
      border-radius: 0 0 28px 28px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-nav { display: flex; align-items: center; gap: 8px; }
    .header-nav button {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.18);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mes-atual { flex: 1; text-align: center; font-size: 16px; font-weight: 800; }

    .timeline { display: flex; align-items: center; }
    .timeline-ponto {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.18);
    }
    .timeline-ponto.positivo { background: var(--success); }
    .timeline-ponto.negativo { background: var(--danger); }
    .timeline-linha { flex: 1; height: 2px; background: rgba(255,255,255,0.35); margin: 0 2px; }
    .timeline-linha.pontilhada { background: repeating-linear-gradient(90deg, rgba(255,255,255,0.55) 0 4px, transparent 4px 8px); }

    .timeline-valores { display: flex; align-items: flex-start; margin-top: -4px; }
    .timeline-item { flex: 1; min-width: 0; text-align: center; }
    .timeline-item.destaque { flex: 1.3; }
    .timeline-item.destaque .timeline-valor { font-size: 21px; }
    .timeline-valor { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .timeline-valor.negativo { color: #ffb4a8; }
    .timeline-label { font-size: 11px; color: rgba(255,255,255,0.75); font-weight: 600; margin-top: 2px; }

    #lista-contas {
      padding: 16px 20px 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 10px;
    }
    .conta-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      min-width: 0;
    }
    .conta-nome, .conta-saldo {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conta-nome { font-size: 11px; color: var(--muted); font-weight: 700; }
    .conta-saldo { font-size: 15px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }

    .secao {
      flex: 1;
      padding: 20px 20px 84px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .secao-titulo { font-size: 14px; font-weight: 800; }
    .dia-label { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 6px; }
    .dia-label:first-child { margin-top: 0; }

    .lancamento-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
    .lancamento-icone {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .lancamento-icone.is-receita { background: var(--success-soft); }
    .lancamento-icone.is-despesa { background: var(--danger-soft); }
    .lancamento-info { flex: 1; min-width: 0; }
    .lancamento-desc { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lancamento-conta { font-size: 12px; color: var(--muted); }
    .lancamento-valor { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .lancamento-valor.is-receita { color: var(--success); }
    .lancamento-valor.is-despesa { color: var(--danger); }

    .conta-vazia { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }

    .secao-resumo {
      padding: 16px 20px 8px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .secao-resumo-topo { display: flex; align-items: center; justify-content: space-between; }
    #btn-gerenciar-cards {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--surface-2);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #secao-resumo { display: flex; flex-direction: column; gap: 14px; }

    .lista-gerenciar-cards { display: flex; flex-direction: column; gap: 4px; }
    .item-gerenciar-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
    }
    .item-gerenciar-card:last-child { border-bottom: none; }
    .item-gerenciar-card span { flex: 1; font-size: 14px; font-weight: 700; }
    .item-gerenciar-card input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }

    .economia-comparativo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .economia-comparativo.melhor { color: var(--success); }
    .economia-comparativo.pior { color: var(--danger); }

    .card-resumo {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .card-resumo-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .card-resumo-titulo { font-size: 14px; font-weight: 800; }
    .card-resumo-ordem { display: flex; gap: 4px; flex-shrink: 0; }
    .card-resumo-ordem button {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: none;
      background: var(--surface-2);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-resumo-ordem button:disabled { opacity: 0.3; }

    .ranking-linha { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .ranking-linha:last-child { margin-bottom: 0; }
    .ranking-nome { width: 78px; flex-shrink: 0; font-size: 12px; color: var(--muted); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ranking-barra-fundo { flex: 1; height: 22px; background: var(--surface-2); border-radius: 11px; overflow: hidden; }
    .ranking-barra-fill { height: 100%; border-radius: 11px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; min-width: 54px; }
    .ranking-pct { font-size: 11px; font-weight: 800; color: #ffffff; white-space: nowrap; }

    .economia-linha { display: flex; align-items: center; gap: 18px; }
    .economia-aro {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .economia-aro::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--surface);
    }
    .economia-aro-valor { position: relative; font-size: 19px; font-weight: 800; text-align: center; line-height: 1.15; }
    .economia-aro-valor small { display: block; font-size: 10px; font-weight: 700; color: var(--muted); margin-top: 1px; }
    .economia-detalhes { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .economia-item { display: flex; align-items: center; gap: 10px; }
    .economia-icone { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .economia-icone.receita { background: var(--success-soft); }
    .economia-icone.despesa { background: var(--danger-soft); }
    .economia-texto-rotulo { font-size: 11px; color: var(--muted); font-weight: 600; }
    .economia-texto-valor { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .economia-texto-valor.receita { color: var(--success); }
    .economia-texto-valor.despesa { color: var(--danger); }
    .economia-valor-total { text-align: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .economia-valor-total .valor { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .economia-valor-total .valor.negativo { color: var(--danger); }
    .economia-valor-total .rotulo { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }

    .pendentes-abas { display: flex; gap: 8px; margin-bottom: 16px; }
    .pendentes-aba {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 2px 10px 2px;
      border-bottom: 2px solid transparent;
    }
    .pendentes-aba.ativa { color: var(--accent); border-bottom-color: var(--accent); }
    .pendentes-conta { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 14px; }
    .pendentes-conta button { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pendentes-conta button:disabled { opacity: 0.3; }
    .pendentes-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pendentes-conteudo { text-align: center; }
    .pendentes-nome-conta { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
    .pendentes-texto { font-size: 14px; line-height: 1.5; }
    .pendentes-texto strong { font-weight: 800; }
    .pendentes-total { font-size: 22px; font-weight: 800; margin: 6px 0 16px 0; font-variant-numeric: tabular-nums; }
    .pendentes-btn {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .cartoes-lista { display: flex; flex-direction: column; }
    .cartoes-linha {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      color: var(--text);
    }
    .cartoes-linha:not(:last-child) { border-bottom: 1px solid var(--border); }
    .cartoes-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cartoes-info { flex: 1; min-width: 0; }
    .cartoes-nome { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
    .cartoes-detalhe { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .cartoes-detalhe span:last-child { color: var(--text); font-weight: 700; }
    .cartoes-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-2);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-top: 12px;
    }
    .cartoes-total .rotulo { font-size: 14px; font-weight: 800; }
    .cartoes-total .valor { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .fab {
      position: fixed;
      right: 50%;
      transform: translateX(190px);
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      width: 58px;
      height: 58px;
      border-radius: 20px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(14,124,134,0.4);
      text-decoration: none;
      z-index: 10;
    }
    @media (max-width: 480px) {
      .fab { right: 20px; transform: none; }
    }

    .nav-inferior {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: center;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-inferior-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-item.ativo { color: var(--accent); }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(16,38,42,0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }
    .sheet-overlay[hidden] { display: none; }
    .sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); align-self: center; }
    .sheet-titulo { font-size: 16px; font-weight: 800; text-align: center; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="header-nav">
        <button type="button" id="btn-mes-anterior" aria-label="Mês anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="mes-atual" id="mes-atual">—</div>
        <button type="button" id="btn-mes-proximo" aria-label="Próximo mês">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="timeline">
        <div class="timeline-ponto" id="ponto-inicial">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="timeline-linha"></div>
        <div class="timeline-ponto" id="ponto-atual"></div>
        <div class="timeline-linha pontilhada"></div>
        <div class="timeline-ponto" id="ponto-previsto">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </div>
      </div>
      <div class="timeline-valores">
        <div class="timeline-item">
          <div class="timeline-valor" id="valor-inicial">R$ 0,00</div>
          <div class="timeline-label">Inicial</div>
        </div>
        <div class="timeline-item destaque">
          <div class="timeline-valor" id="valor-atual">R$ 0,00</div>
          <div class="timeline-label">Saldo atual</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-valor" id="valor-previsto">R$ 0,00</div>
          <div class="timeline-label">Previsto</div>
        </div>
      </div>
    </div>

    <div id="lista-contas"></div>

    <div class="secao-resumo">
      <div class="secao-resumo-topo">
        <div class="secao-titulo">Resumo</div>
        <button type="button" id="btn-gerenciar-cards" aria-label="Gerenciar cards">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div id="secao-resumo"></div>
    </div>

    <div class="secao">
      <div class="secao-titulo">Últimos lançamentos</div>
      <div id="lista-lancamentos"></div>
    </div>

    <a class="fab" href="/pages/lancar.html" aria-label="Lançar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>

    <div class="nav-inferior">
      <div class="nav-inferior-inner">
        <a class="nav-item ativo" href="/pages/home.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"/></svg>
          Início
        </a>
        <a class="nav-item" href="/pages/cartao.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>
          Cartão
        </a>
        <a class="nav-item" href="/pages/extrato.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          Extrato
        </a>
        <button type="button" class="nav-item" id="btn-sair-nav">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Sair
        </button>
      </div>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-cards" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-titulo">Cards do Resumo</div>
      <div class="lista-gerenciar-cards" id="lista-gerenciar-cards"></div>
      <button type="button" class="btn-primary" id="btn-concluir-cards">Concluído</button>
    </div>
  </div>

  <script type="module" src="../js/home.js"></script>
</body>
</html>
