<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (function () {
      function h() { return (window.visualViewport ? window.visualViewport.height : window.innerHeight) + 'px'; }
      document.documentElement.style.setProperty('--app-vh', h());
      window.addEventListener('resize', function () { document.documentElement.style.setProperty('--app-vh', h()); });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { document.documentElement.style.setProperty('--app-vh', h()); });
      }
    })();
  </script>
  <title>FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; }
    .shell {
      width: 100%;
      max-width: 480px;
      height: var(--app-vh, 100dvh);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, var(--accent-grad-1), var(--accent-grad-2));
      padding: calc(36px + env(safe-area-inset-top, 0px)) 20px 22px 20px;
      border-radius: 0 0 28px 28px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .saldo-label { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 600; }
    .saldo-valor { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
    #btn-sair {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
    }

    #lista-contas {
      padding: 16px 20px 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 10px;
    }
    .conta-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      min-width: 0;
    }
    .conta-nome, .conta-saldo {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conta-nome { font-size: 11px; color: var(--muted); font-weight: 700; }
    .conta-saldo { font-size: 15px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }

    .secao {
      flex: 1;
      min-height: 0;
      padding: 20px 20px 84px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .secao-titulo { font-size: 14px; font-weight: 800; }
    .dia-label { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 6px; }
    .dia-label:first-child { margin-top: 0; }

    .lancamento-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
    .lancamento-icone {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .lancamento-icone.is-receita { background: var(--success-soft); }
    .lancamento-icone.is-despesa { background: var(--danger-soft); }
    .lancamento-info { flex: 1; min-width: 0; }
    .lancamento-desc { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lancamento-conta { font-size: 12px; color: var(--muted); }
    .lancamento-valor { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .lancamento-valor.is-receita { color: var(--success); }
    .lancamento-valor.is-despesa { color: var(--danger); }

    .conta-vazia { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }

    .fab {
      position: absolute;
      right: 20px;
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      width: 58px;
      height: 58px;
      border-radius: 20px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(14,124,134,0.4);
      text-decoration: none;
      z-index: 10;
    }

    .nav-inferior {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-inferior-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
    }
    .nav-item.ativo { color: var(--accent); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div>
        <div class="saldo-label">Saldo total</div>
        <div class="saldo-valor" id="saldo-total">R$ 0,00</div>
      </div>
      <button id="btn-sair" type="button">Sair</button>
    </div>

    <div id="lista-contas"></div>

    <div class="secao">
      <div class="secao-titulo">Últimos lançamentos</div>
      <div id="lista-lancamentos"></div>
    </div>

    <a class="fab" href="/pages/lancar.html" aria-label="Lançar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>

    <div class="nav-inferior">
      <div class="nav-inferior-inner">
        <a class="nav-item ativo" href="/pages/home.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"/></svg>
          Início
        </a>
        <a class="nav-item" href="/pages/cartao.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>
          Cartão
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/home.js"></script>
</body>
</html>
