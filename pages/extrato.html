<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Extrato — FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .topo {
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .topo-titulo { font-size: 20px; font-weight: 800; }

    .seletor-mes {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 6px;
    }
    .seletor-mes button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: var(--surface-2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mes-atual { font-size: 14px; font-weight: 800; }

    .filtros { display: flex; gap: 8px; }
    .filtros select {
      flex: 1;
      min-width: 0;
      height: 40px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      padding: 0 12px;
    }

    .resumo { display: flex; gap: 10px; }
    .resumo-card { flex: 1; border-radius: var(--radius-md); padding: 12px 14px; }
    .resumo-card.entradas { background: var(--success-soft); }
    .resumo-card.saidas { background: var(--danger-soft); }
    .resumo-rotulo { font-size: 11px; font-weight: 700; }
    .resumo-card.entradas .resumo-rotulo, .resumo-card.entradas .resumo-valor { color: var(--success); }
    .resumo-card.saidas .resumo-rotulo, .resumo-card.saidas .resumo-valor { color: var(--danger); }
    .resumo-valor { font-size: 16px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }

    .secao {
      flex: 1;
      padding: 4px 20px 84px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dia-label { font-size: 12px; color: var(--muted); font-weight: 700; padding: 10px 0 2px 0; }
    .dia-label:first-child { padding-top: 0; }

    .lancamento-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
    .lancamento-icone {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .lancamento-icone.is-receita { background: var(--success-soft); }
    .lancamento-icone.is-despesa { background: var(--danger-soft); }
    .lancamento-info { flex: 1; min-width: 0; }
    .lancamento-desc { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lancamento-conta { font-size: 12px; color: var(--muted); }
    .lancamento-valor { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .lancamento-valor.is-receita { color: var(--success); }
    .lancamento-valor.is-despesa { color: var(--danger); }

    .conta-vazia { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }

    .nav-inferior {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: center;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-inferior-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
    }
    .nav-item.ativo { color: var(--accent); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topo">
      <div class="topo-titulo">Extrato</div>

      <div class="seletor-mes">
        <button type="button" id="btn-mes-anterior" aria-label="Mês anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="mes-atual">—</span>
        <button type="button" id="btn-mes-proximo" aria-label="Próximo mês">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="filtros">
        <select id="filtro-conta"><option value="">Todas contas</option></select>
        <select id="filtro-categoria"><option value="">Todas categorias</option></select>
      </div>

      <div class="resumo">
        <div class="resumo-card entradas">
          <div class="resumo-rotulo">ENTRADAS</div>
          <div class="resumo-valor" id="total-entradas">R$ 0,00</div>
        </div>
        <div class="resumo-card saidas">
          <div class="resumo-rotulo">SAÍDAS</div>
          <div class="resumo-valor" id="total-saidas">R$ 0,00</div>
        </div>
      </div>
    </div>

    <div class="secao">
      <div id="lista-lancamentos"></div>
    </div>

    <div class="nav-inferior">
      <div class="nav-inferior-inner">
        <a class="nav-item" href="/pages/home.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"/></svg>
          Início
        </a>
        <a class="nav-item" href="/pages/cartao.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>
          Cartão
        </a>
        <a class="nav-item ativo" href="/pages/extrato.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          Extrato
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/extrato.js"></script>
</body>
</html>
