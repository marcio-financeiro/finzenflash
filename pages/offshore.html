<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offshore — FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; align-items: flex-start; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: calc(156px + env(safe-area-inset-bottom, 0px));
    }
    .topo {
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topo-titulo { font-size: 20px; font-weight: 800; }
    .btn-privacidade {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--surface-2);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .conteudo { padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 20px; }

    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      min-width: 0;
    }
    .kpi-rotulo { font-size: 11px; color: var(--muted); font-weight: 700; }
    .kpi-valor { font-size: 20px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .card-cabecalho { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-titulo { font-size: 14px; font-weight: 800; }
    .btn-add-card {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: none;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .conta-vazia { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

    .ciclo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      font-family: inherit;
      color: var(--text);
    }
    .ciclo-item:last-child { border-bottom: none; }
    .ciclo-status-ponto { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .ciclo-info { flex: 1; min-width: 0; }
    .ciclo-plataforma { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ciclo-detalhe { font-size: 12px; color: var(--muted); }
    .ciclo-dias { font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }

    .he-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      font-family: inherit;
      color: var(--text);
    }
    .he-item:last-child { border-bottom: none; }
    .he-info { flex: 1; min-width: 0; }
    .he-data { font-size: 14px; font-weight: 800; }
    .he-detalhe { font-size: 12px; color: var(--muted); }
    .he-valor { font-size: 14px; font-weight: 800; color: var(--success); white-space: nowrap; }

    .curso-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      font-family: inherit;
      color: var(--text);
    }
    .curso-item:last-child { border-bottom: none; }
    .curso-status-ponto { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .curso-info { flex: 1; min-width: 0; }
    .curso-nome { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .curso-detalhe { font-size: 12px; color: var(--muted); }
    .curso-venc { font-size: 12px; font-weight: 800; white-space: nowrap; text-align: right; }

    .historico-tabela { width: 100%; border-collapse: collapse; font-size: 12px; }
    .historico-tabela th { text-align: left; color: var(--muted); font-weight: 700; padding: 0 6px 8px 6px; font-size: 11px; }
    .historico-tabela td { padding: 8px 6px; border-top: 1px solid var(--border); }
    .historico-tabela-wrap { overflow-x: auto; }

    .fab {
      position: fixed;
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      right: 26px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(14,124,134,0.35);
      z-index: 15;
    }

    .nav-inferior {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-inferior-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-item.ativo { color: var(--accent); }

    .mais-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      font-family: inherit;
      text-align: left;
    }
    .mais-item:last-child { border-bottom: none; }
    .mais-item svg { flex-shrink: 0; color: var(--muted); }
    .mais-item.ativo { color: var(--accent); }
    .mais-item.ativo svg { color: var(--accent); }
    .mais-item.perigo { color: var(--danger); }
    .mais-item.perigo svg { color: var(--danger); }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(16,38,42,0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }
    .sheet-overlay[hidden] { display: none; }
    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: calc(85vh - env(safe-area-inset-top, 0px));
      overflow-y: auto;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); align-self: center; flex-shrink: 0; }
    .sheet-titulo { font-size: 16px; font-weight: 800; text-align: center; flex-shrink: 0; }
    .sheet-aviso { font-size: 13px; color: var(--muted); text-align: center; margin-top: -8px; flex-shrink: 0; }
    .sheet-acao-btn {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .sheet-acao-btn.perigo { border-color: var(--danger); color: var(--danger); }

    .toggle-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }
    .toggle-linha span { font-size: 14px; font-weight: 700; }
    .toggle-linha input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }

    .form-linha { display: flex; gap: 10px; }
    .form-linha .field { flex: 1; }
    .field select, .field textarea {
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0 14px;
      font-size: 15px;
      font-family: inherit;
      width: 100%;
    }
    .field select { height: 52px; }
    .field textarea { padding: 12px 14px; resize: vertical; min-height: 60px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topo">
      <div class="topo-titulo">Offshore</div>
      <button type="button" class="btn-privacidade" id="btn-privacidade" aria-label="Ocultar valores"></button>
    </div>

    <div class="conteudo">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-rotulo">DIAS EMBARCADO (ANO)</div>
          <div class="kpi-valor" id="kpi-dias-emb">0d</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-rotulo">DIAS EM CASA (ANO)</div>
          <div class="kpi-valor" id="kpi-dias-casa">0d</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-rotulo">CICLOS CONCLUÍDOS</div>
          <div class="kpi-valor" id="kpi-ciclos">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-rotulo">HE DO CICLO ATUAL</div>
          <div class="kpi-valor" id="kpi-he">0,0h</div>
        </div>
      </div>

      <div class="card">
        <div class="card-cabecalho">
          <div class="card-titulo">Ciclos de embarque</div>
          <button type="button" class="btn-add-card" id="btn-novo-ciclo" aria-label="Novo ciclo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="lista-ciclos"><div class="conta-vazia">Carregando...</div></div>
      </div>

      <div class="card">
        <div class="card-cabecalho">
          <div class="card-titulo">Cursos e certificações</div>
          <button type="button" class="btn-add-card" id="btn-novo-curso" aria-label="Novo curso">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="lista-cursos"><div class="conta-vazia">Carregando...</div></div>
      </div>

      <div class="card">
        <div class="card-cabecalho">
          <div class="card-titulo">Horas extras / sobreaviso</div>
          <button type="button" class="btn-add-card" id="btn-nova-he" aria-label="Registrar horas">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="lista-he"><div class="conta-vazia">Carregando...</div></div>
      </div>

      <div class="card">
        <div class="card-titulo" style="margin-bottom:12px;">Histórico por plataforma</div>
        <div id="lista-historico"><div class="conta-vazia">Carregando...</div></div>
      </div>
    </div>

    <a class="fab" href="#" id="btn-novo-ciclo-fab" aria-label="Novo ciclo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>

    <div id="nav-inferior-slot"></div>
  </div>

  <div class="sheet-overlay" id="sheet-form" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="sheet-form-conteudo"></div>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-acao-ciclo" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="sheet-acao-ciclo-conteudo"></div>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-acao-he" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="sheet-acao-he-conteudo"></div>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-acao-curso" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="sheet-acao-curso-conteudo"></div>
    </div>
  </div>

  <script type="module" src="../js/offshore.js?v=5"></script>
</body>
</html>
