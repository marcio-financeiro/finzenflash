<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luna — FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; align-items: flex-start; }
    html, body { height: 100%; }
    .shell {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topo a { display: flex; color: var(--text); }
    .topo-icone {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .topo-titulo { font-size: 16px; font-weight: 800; flex: 1; min-width: 0; }
    .topo-status { font-size: 11px; color: var(--muted); font-weight: 600; }
    .btn-limpar {
      background: none;
      border: none;
      color: var(--muted);
      padding: 6px;
      display: flex;
    }

    .chat-suggestions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px;
      flex-shrink: 0;
    }
    .chat-suggestions::-webkit-scrollbar { display: none; }
    .chat-chip {
      flex-shrink: 0;
      white-space: nowrap;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
    }

    #mensagens {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      padding: 20px;
      color: var(--muted);
    }
    .chat-empty-icone {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-empty h3 { font-size: 16px; color: var(--text); font-weight: 800; }
    .chat-empty p { font-size: 13px; line-height: 1.5; max-width: 280px; }

    .chat-msg { display: flex; gap: 8px; align-items: flex-start; max-width: 88%; }
    .chat-msg-user { align-self: flex-end; flex-direction: row-reverse; }
    .chat-avatar {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    .chat-msg-ai .chat-avatar { background: var(--accent-soft); color: var(--accent); }
    .chat-msg-user .chat-avatar { background: var(--surface-2); color: var(--muted); }
    .chat-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 13px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
    }
    .chat-msg-user .chat-bubble { background: var(--accent); border-color: var(--accent); color: #fff; }
    .luna-p { margin: 0 0 8px 0; }
    .luna-p:last-child { margin-bottom: 0; }
    .luna-h4 { font-size: 14px; font-weight: 800; margin: 4px 0; }
    .luna-ul { margin: 4px 0 8px 18px; padding: 0; }
    .luna-ul li { margin-bottom: 2px; }

    .chat-dots { display: flex; gap: 4px; padding: 4px 0; }
    .chat-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      animation: chatDot 1.2s infinite ease-in-out;
    }
    .chat-dots span:nth-child(2) { animation-delay: 0.15s; }
    .chat-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes chatDot { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
    .chat-cursor {
      display: inline-block;
      width: 6px; height: 14px;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: middle;
      animation: chatBlink 0.9s infinite;
    }
    @keyframes chatBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .chat-input-area {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)) 16px;
    }
    .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
    .chat-input-row textarea {
      flex: 1;
      resize: none;
      max-height: 120px;
      min-height: 42px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 11px 16px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.3;
    }
    .chat-input-row textarea:disabled { opacity: 0.6; }
    #btnEnviar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #btnEnviar:disabled { opacity: 0.5; }
    .chat-hint { font-size: 10px; color: var(--muted); text-align: center; margin: 6px 0 0 0; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topo">
      <a href="/pages/home.html" aria-label="Voltar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="topo-icone">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>
      </div>
      <div>
        <div class="topo-titulo">Luna</div>
        <div class="topo-status" id="statusContexto">Carregando seus dados...</div>
      </div>
      <button type="button" class="btn-limpar" id="btnLimpar" aria-label="Limpar conversa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
      </button>
    </div>

    <div class="chat-suggestions" id="chatSuggestions">
      <button class="chat-chip" data-msg="Como foram meus gastos esse mês?">Gastos do mês</button>
      <button class="chat-chip" data-msg="Quanto tenho de fatura de cartão aberta?">Faturas abertas</button>
      <button class="chat-chip" data-msg="Onde posso economizar esse mês?">Onde economizar</button>
      <button class="chat-chip" data-msg="Vou fechar o mês no azul ou no vermelho?">Previsão do mês</button>
      <button class="chat-chip" data-msg="Tenho algum lançamento pendente essa semana?">Pendentes</button>
    </div>

    <div id="mensagens">
      <div id="emptyState" class="chat-empty">
        <div class="chat-empty-icone">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>
        </div>
        <h3>Olá! Eu sou a Luna</h3>
        <p>Tenho acesso aos seus dados financeiros reais. Pergunte sobre gastos, receitas, cartões e mais.</p>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea id="inputMsg" placeholder="Carregando dados..." rows="1" disabled></textarea>
        <button type="button" id="btnEnviar" disabled aria-label="Enviar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
        </button>
      </div>
      <p class="chat-hint">A Luna não substitui aconselhamento financeiro profissional.</p>
    </div>
  </div>

  <script type="module" src="../js/luna.js?v=2"></script>
</body>
</html>
