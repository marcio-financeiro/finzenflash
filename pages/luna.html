<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luna — FinZen Flash</title>
  <link rel="icon" href="/img/logo-mark.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinZen Flash">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; justify-content: center; align-items: flex-start; }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .topo {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 8px 20px;
    }
    .topo a { display: flex; color: var(--text); }
    .topo-titulo { font-size: 17px; font-weight: 800; flex: 1; }

    .conteudo {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px 32px;
      text-align: center;
    }
    .luna-icone {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--surface);
      border: 1.5px solid var(--accent);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .luna-titulo { font-size: 18px; font-weight: 800; }
    .luna-texto { font-size: 14px; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topo">
      <a href="/pages/home.html" aria-label="Voltar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="topo-titulo">Luna</div>
    </div>

    <div class="conteudo">
      <div class="luna-icone">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>
      </div>
      <div class="luna-titulo">Luna chega em breve</div>
      <div class="luna-texto">Sua assistente de IA financeira está sendo preparada. Em breve você vai poder conversar com a Luna sobre seus gastos, metas e investimentos.</div>
    </div>
  </div>
</body>
</html>
